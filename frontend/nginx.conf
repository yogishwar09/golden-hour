server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  # Hashed asset filenames are immutable, so they can be cached indefinitely.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # index.html must never be cached, or a deploy would not reach returning
  # visitors until their cache expired.
  location = /index.html {
    add_header Cache-Control "no-cache, must-revalidate";
  }

  # A single-page app owns its own routing: every unknown path serves the shell.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
