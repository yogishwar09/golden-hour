# One blueprint that deploys the whole system: the API and the web front end.
#
# Render reads this when you connect the repository as a Blueprint, and creates
# both services itself. Keeping the front end here rather than on a second
# platform means one account, one dashboard and one place to look when
# something breaks.
services:
  # ---------------------------------------------------------------- the API --
  - type: web
    name: golden-hour-api
    runtime: node
    plan: free
    # Singapore is Render's closest region to India; latency matters because
    # every dispatch decision is a round trip to this service.
    region: singapore
    # --include=dev is required: NODE_ENV is production here, which makes npm
    # omit devDependencies, and the TypeScript compiler is one of them.
    buildCommand: npm ci --include=dev && npm run build:shared && npm run build --workspace @sas/backend
    startCommand: node backend/dist/server.js
    healthCheckPath: /api/ready
    envVars:
      - key: NODE_VERSION
        value: '22'
      - key: NODE_ENV
        value: production
      # mongodb-memory-server is a dev dependency the production server never
      # loads; this stops its install step downloading a MongoDB binary.
      - key: MONGOMS_DISABLE_POSTINSTALL
        value: '1'
      # Render supplies PORT; the server reads it.
      - key: JWT_SECRET
        generateValue: true
      # Set in the dashboard: your MongoDB Atlas connection string.
      - key: MONGO_URI
        sync: false
      # Set in the dashboard once the web service below has its URL.
      - key: CORS_ORIGINS
        sync: false
      - key: LOG_LEVEL
        value: info

  # ----------------------------------------------------------- the web app --
  - type: web
    name: golden-hour-web
    runtime: static
    # --include=dev for the same reason as the API: vite and the TypeScript
    # compiler are devDependencies.
    buildCommand: npm ci --include=dev && npm run build:shared && npm run build --workspace @sas/frontend
    staticPublishPath: frontend/dist
    envVars:
      - key: NODE_VERSION
        value: '22'
      - key: MONGOMS_DISABLE_POSTINSTALL
        value: '1'
      # Set in the dashboard to the API service's URL. Vite reads this at BUILD
      # time, so changing it needs a redeploy rather than a restart.
      - key: VITE_API_URL
        sync: false
    routes:
      # A single-page app owns its own routing: every unknown path serves the
      # shell rather than a 404.
      - type: rewrite
        source: /*
        destination: /index.html
